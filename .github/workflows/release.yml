name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Keep this job Flutter-free. Jobs run on isolated runners, so any Flutter
  # setup or pub get done here would have to be repeated in both build jobs.
  preflight:
    name: Check tag and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tag against pubspec version
        run: python tool/ci_release.py check-tag "$GITHUB_REF_NAME"

      - name: Check changelog section
        run: |
          VERSION="$(python tool/ci_release.py version)"
          python tool/ci_release.py release-body "$VERSION" > /dev/null

  build-windows:
    name: Build Windows x64
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'

      - name: Check pinned toolchain
        run: dart run tool/verify_toolchain.dart

      - name: Install dependencies
        run: flutter pub get

      # Analyze runs once here, not in every build job. Tests are run locally
      # before tagging; on CI they cost ~90s and would only repeat that work.
      - name: Analyze
        run: flutter analyze

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build release
        run: flutter build windows --release

      - name: Add Node and Python runtimes
        shell: pwsh
        run: |
          $runtime = 'build/windows/x64/runner/Release/runtime'
          $nodeDir = Join-Path $runtime 'node'
          $pyDir = Join-Path $runtime 'python'
          $pyHostDir = Join-Path $runtime 'pyhost'

          New-Item -ItemType Directory -Force -Path $nodeDir, $pyDir, $pyHostDir | Out-Null

          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v18.20.4/node-v18.20.4-win-x64.zip' -OutFile 'node.zip'
          Expand-Archive -Path 'node.zip' -DestinationPath '.' -Force
          Copy-Item 'node-v18.20.4-win-x64/node.exe' (Join-Path $nodeDir 'node.exe') -Force
          Copy-Item 'assets/runtime/node/*.js' $nodeDir -Force

          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile 'python.zip'
          Expand-Archive -Path 'python.zip' -DestinationPath $pyDir -Force
          $pth = Join-Path $pyDir 'python311._pth'
          $lines = Get-Content $pth | ForEach-Object {
            if ($_ -eq '#import site') { 'import site' } else { $_ }
          }
          $lines += 'Lib\site-packages'
          Set-Content -Path $pth -Value $lines -Encoding ascii

          python -m pip install --target (Join-Path $pyDir 'Lib/site-packages') `
            requests==2.34.2 lxml==6.1.3 pycryptodome==3.24.1 `
            pyquery==2.1.0 beautifulsoup4==4.15.0

          Copy-Item 'assets/runtime/pyhost/*' $pyHostDir -Recurse -Force

          & (Join-Path $nodeDir 'node.exe') --version
          & (Join-Path $pyDir 'python.exe') -c 'import requests, lxml, pyquery, Crypto; print("python runtime ok")'

      - name: Package
        shell: pwsh
        run: |
          $source = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $source)) { throw "Missing Windows build output: $source" }
          Compress-Archive -Path "$source/*" -DestinationPath 'LaiCuiBa-windows-x64.zip' -Force

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: LaiCuiBa-windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Check pinned toolchain
        run: dart run tool/verify_toolchain.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Android
        run: flutter config --enable-android

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release

      - name: Package
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          cp "$apk" LaiCuiBa-android.apk

      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: LaiCuiBa-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release body from CHANGELOG.md
        run: |
          VERSION="$(python tool/ci_release.py version)"
          python tool/ci_release.py release-body "$VERSION" --output release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/windows-x64/LaiCuiBa-windows-x64.zip
            artifacts/android-apk/LaiCuiBa-android.apk
