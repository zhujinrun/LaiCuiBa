name: lai_cui_ba
description: "LaiCuiBa - a self-maintained Flutter desktop media client."
publish_to: 'none'
version: 0.1.0+1

# Pinned to the toolchain the original app was built with. Hotfixes inside the
# same minor are allowed; a new minor must be a deliberate, verified upgrade.
# Verify with: dart run tool/verify_toolchain.dart
environment:
  sdk: ">=3.12.0 <3.13.0"
  flutter: ">=3.44.9 <3.45.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: 0.5.2
  liquid_glass_widgets: ^1.18.0
  shared_preferences: ^2.5.3
  file_selector: ^1.1.0
  archive: ^4.7.1
  crypto: ^3.0.8
  path: ^1.9.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-LICENSE.txt
    # Artwork, config and lookup data carried over verbatim from the original
    # bundle (data/flutter_assets/assets). See ARCHITECTURE.md for provenance.
    - assets/app_icons/
    - assets/i18n/
    - assets/loading/
    - assets/tv/
    - assets/shaders/
    - assets/widget_samples/
    - assets/pinyin.txt
    - assets/torrent_trackers.txt
    # Posters the original app had already cached locally; used as fixture art
    # so the home feed matches it frame by frame. Self-use only.
    - assets/demo/

  fonts:
    - family: LcbSerif
      fonts:
        - asset: assets/fonts/LcbSerif-SemiBold.otf
          weight: 600
